name: Build JavaScript

on:
  workflow_call:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cno
    steps:
      - uses: actions/checkout@v4
        with:
          path: cno
          persist-credentials: false

      # Keep the sibling layout used by package.json and native declarations.
      - name: Check out circu.js declarations
        uses: actions/checkout@v4
        with:
          repository: imzlh/circu.js
          ref: d4ad1b5ae718262659cf85053d54aee8f49af979
          path: circu.js
          sparse-checkout: types
          persist-credentials: false

      - name: Check out HTTP source
        uses: actions/checkout@v4
        with:
          repository: imzlh/cno-stdhttp
          ref: 94114402c7c1d68f3a48ece6b4e84280ac924bbb
          path: http
          persist-credentials: false

      - name: Check out QUIC declarations
        uses: actions/checkout@v4
        with:
          repository: imzlh/cno-ext-quic
          ref: 32afd507d4f4b52b26bb1ef9449f3606c9aaae3f
          path: ext-quic
          sparse-checkout: |
            native.d.ts
            index.d.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Check out the shared CTS event dispatcher
        uses: actions/checkout@v4
        with:
          repository: imzlh/cts
          ref: dd2741052b7254f2650666dc0255c06e2c54f7f7
          path: cts
          sparse-checkout: src/runtime/event-mux.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: cno/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: cno/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (process.env.GITHUB_REF_NAME !== `v${version}`) {
              throw new Error("Release tag must match package.json version");
            }
          '

      - run: pnpm run type-check:bundle
      - run: pnpm run build
      - run: pnpm run min-build

      - name: Validate and checksum JavaScript artifacts
        run: |
          node --check dist.js
          node --check dist.min.js
          sha256sum dist.js dist.min.js > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: cno-js
          path: |
            cno/dist.js
            cno/dist.min.js
            cno/SHA256SUMS
          if-no-files-found: error
